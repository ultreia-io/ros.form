    layout: {kind: table, column_count: 32, start_row: 6}
    fields:
      observed_trip_number: {mandatory: true, type: string}
      vessel_information_identification_name: {mandatory: true, type: string}
      vessel_information_identification_flag_or_chartering_code: {mandatory: true, type: string, reference: refs_admin.countries}
