      observed_trip_summary_number_of_sets_observed: {mandatory: true, type: integer}
      observed_trip_summary_number_of_days_searching: {mandatory: true, type: integer}
      observed_trip_summary_number_of_days_actively_fishing: {mandatory: true, type: integer}
