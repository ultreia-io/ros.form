      observer_trip_details_embarkation_at_sea_timestamp: {mandatory: true, type: datetime}
      observer_trip_details_disembarkation_in_port_country_code: {type: string, reference: refs_admin.countries}
      observer_trip_details_disembarkation_in_port_port_code: {type: string, reference: refs_admin.ports}
      observer_trip_details_disembarkation_at_sea_latitude: {mandatory: true, type: number}
      observer_trip_details_disembarkation_at_sea_longitude: {mandatory: true, type: number}
      observer_trip_details_disembarkation_at_sea_timestamp: {mandatory: true, type: datetime}
