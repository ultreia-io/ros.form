      vessel_information_owner_and_personnel_owner_full_name: {type: string}
      vessel_information_owner_and_personnel_owner_nationality_code: {type: string}
      vessel_information_owner_and_personnel_owner_contact_details: {type: string}
      vessel_information_owner_and_personnel_charter_or_operator_full_name: {type: string}
      vessel_information_owner_and_personnel_charter_or_operator_nationality_code: {type: string, reference: refs_admin.countries}
      vessel_information_owner_and_personnel_charter_or_operator_contact_details: {type: string}
      vessel_information_owner_and_personnel_charter_or_operator_contact_details2: {type: string}
      vessel_information_owner_and_personnel_fishing_master_full_name: {mandatory: true, type: string}
