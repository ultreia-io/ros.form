      observed_trip_summary_number_of_days_transiting: {type: integer}
      observed_trip_summary_number_of_days_lost: {mandatory: true, type: integer}
      observed_trip_summary_reasons_for_days_lost_reason_1_code: {type: string, reference: refs_fishery.reasons_days_lost}
      observed_trip_summary_reasons_for_days_lost_reason_2_code: {type: string, reference: refs_fishery.reasons_days_lost}
      observed_trip_summary_reasons_for_days_lost_reason_3_code: {type: string, reference: refs_fishery.reasons_days_lost}
      observed_trip_summary_reasons_for_days_lost_reason_4_code: {type: string, reference: refs_fishery.reasons_days_lost}
