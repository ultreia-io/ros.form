schema_version: 1.0.0
form:
  id: ps
  version: 3.3.0
references:
- refs_admin.countries
- refs_admin.ports
- refs_fishery.reasons_days_lost
- refs_biology.species
- refs_fishery_config.gears
- refs_fishery.hull_material_types
- refs_fishery.fish_preservation_methods
- refs_fishery.fish_storage_types
- refs_fishery.waste_categories
- refs_fishery.waste_disposal_methods
- refs_fishery.school_sighting_cues
- refs_fishery.school_detection_methods
- refs_fishery.fad_raft_designs
- refs_fishery.fad_tail_designs
- refs_biology.types_of_fate
- refs_biology.fates
- refs_biology.sampling_methods_for_catch_estimation
- refs_fishery.fish_processing_types
- refs_biology.measurement_tools
- refs_biology.individual_conditions
- refs_biology.measurements
- refs_biology.sex
- refs_biology.sampling_periods
- refs_biology.tag_types
- refs_biology.gear_interactions
- refs_biology.handling_methods
- refs_fishery.surface_fishery_activities
sheets:
  META:
    layout: {kind: cells, column_count: 6}
    fields:
      form_version: {mandatory: true, location: E5, type: string, pattern: ^1\.0\.0$}
      data_model_version: {mandatory: true, location: E6, type: string, pattern: ^3\.2\.1$|^3\.3\.0$}
      liaison_officer_full_name: {mandatory: true, location: E16, type: string}
      liaison_officer_email: {mandatory: true, location: E18, type: string}
      organisation_name: {mandatory: true, location: E14, type: string}
      reporting_country_code: {mandatory: true, location: E12, type: string, reference: refs_admin.countries}
      finalisation_date: {mandatory: true, location: E20, type: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
      submission_date: {mandatory: true, location: E22, type: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
      comments: {location: C25, type: string}
  O-INFO:
    layout: {kind: table, column_count: 25, start_row: 6}
    fields:
      observed_trip_number: {mandatory: true, type: string}
      observer_identification_observer_iotc_number: {mandatory: true, type: string}
      observer_identification_full_name: {type: string}
      observer_identification_nationality_code: {type: string}
      observer_trip_details_embarkation_in_port_country_code: {type: string, reference: refs_admin.countries}
      observer_trip_details_embarkation_in_port_port_code: {type: string, reference: refs_admin.ports}
