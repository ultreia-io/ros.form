      vessel_information_owner_and_personnel_skipper_captain_full_name: {mandatory: true, type: string}
      vessel_information_owner_and_personnel_skipper_captain_nationality_code: {mandatory: true, type: string, reference: {id: refs_admin.countries, severity: warning}}
      vessel_information_owner_and_personnel_crew_number: {type: integer}
