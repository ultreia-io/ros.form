sheets:
  META:
    layout: {kind: cells, column_count: 6}
    fields:
      form_version: {mandatory: true, location: E5, type: string, pattern: ^1\.0\.0$}
      data_model_version: {mandatory: true, location: E6, type: string, pattern: ^3\.2\.1$|^3\.3\.0$}
      liaison_officer_full_name: {mandatory: true, location: E16, type: string}
      liaison_officer_email: {mandatory: true, location: E18, type: string}
      organisation_name: {mandatory: true, location: E14, type: string}
      reporting_country_code: {mandatory: true, location: E12, type: string, reference: refs_admin.countries}
      finalisation_date: {mandatory: true, location: E20, type: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
      submission_date: {mandatory: true, location: E22, type: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
      comments: {location: C25, type: string}
  O-INFO:
    layout: {kind: table, column_count: 25, start_row: 6}
